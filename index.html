<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Online HTML- &amp; CSS-Editor</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.1.0/css/all.min.css">
	<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.45.2/src-min-noconflict/ace.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.45.2/src-min-noconflict/ext-language_tools.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.45.2/src-min-noconflict/ext-beautify.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
	<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
	<header class="topbar">
		<div class="brand"><span class="brand-mark"><i class="fa-solid fa-code" aria-hidden="true"></i></span><span>Webeditor</span></div>

		<div class="toolbar">
			<label class="project-title-wrap" for="projectTitle"><span class="project-title-label">Projektname: </span><input id="projectTitle" class="project-title-input" type="text" value="Webseitenprojekt" maxlength="80" placeholder="Projekttitel" aria-label="Projekttitel"></label>
			<button id="runButton" class="button button-primary" aria-label="Vorschau starten" title="Vorschau starten"><i class="fa-solid fa-play" aria-hidden="true"></i><span class="button-text">Vorschau</span></button>
			<button id="downloadZip" class="button" aria-label="Projekt als ZIP herunterladen" title="Projekt als ZIP herunterladen"><i class="fa-solid fa-download" aria-hidden="true"></i><span class="button-text">Projekt als ZIP downloaden</span></button>
			<button id="resetButton" class="button" title="Zurücksetzen" aria-label="Zurücksetzen"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i></button>
			<button id="themeToggle" class="button" title="Darkmode aktivieren" aria-label="Darkmode aktivieren"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
		</div>
	</header>

	<div class="app-shell">
		<main class="workspace">
			<section class="editors" aria-label="Code-Editoren">
				<section class="editor-panel" id="htmlPanel" aria-labelledby="htmlPanelTitle htmlPanelFile">
					<div class="panel-header">
						<span class="panel-title" id="htmlPanelTitle">HTML</span><span class="panel-meta" id="htmlPanelFile">index.html</span>
						<button class="panel-button format-button" data-format="html" title="HTML-Code aufräumen" aria-label="HTML-Code aufräumen" aria-controls="htmlEditor"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span class="button-text">Aufräumen</span></button>
						<button class="panel-button download-button" id="downloadHtml" title="HTML-Datei herunterladen" aria-label="HTML-Datei herunterladen" aria-controls="htmlEditor"><i class="fa-solid fa-download" aria-hidden="true"></i><span class="button-text">Download</span></button>
						<button class="panel-button collapse-button" data-collapse="html" aria-expanded="true" aria-controls="htmlEditor" title="HTML-Editor einklappen" aria-label="HTML-Editor einklappen"><i class="fa-solid fa-chevron-up" aria-hidden="true"></i></button>
					</div>
					<div id="htmlEditor" class="ace-editor" aria-labelledby="htmlPanelTitle htmlPanelFile"></div>
				</section>
				<section class="editor-panel" id="cssPanel" aria-labelledby="cssPanelTitle cssPanelFile">
					<div class="panel-header">
						<span class="panel-title" id="cssPanelTitle">CSS</span><span class="panel-meta" id="cssPanelFile">style.css</span>
						<button class="panel-button format-button" data-format="css" title="CSS-Code aufräumen" aria-label="CSS-Code aufräumen" aria-controls="cssEditor"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span class="button-text">Aufräumen</span></button>
						<button class="panel-button download-button" id="downloadCss" title="CSS-Datei herunterladen" aria-label="CSS-Datei herunterladen" aria-controls="cssEditor"><i class="fa-solid fa-download" aria-hidden="true"></i><span class="button-text">Download</span></button>
						<button class="panel-button collapse-button" data-collapse="css" aria-expanded="true" aria-controls="cssEditor" title="CSS-Editor einklappen" aria-label="CSS-Editor einklappen"><i class="fa-solid fa-chevron-up" aria-hidden="true"></i></button>
					</div>
					<div id="cssEditor" class="ace-editor" aria-labelledby="cssPanelTitle cssPanelFile"></div>
				</section>
				<section class="editor-panel collapsed" id="jsPanel" aria-labelledby="jsPanelTitle jsPanelFile">
					<div class="panel-header">
						<span class="panel-title" id="jsPanelTitle">JavaScript</span><span class="panel-meta" id="jsPanelFile">script.js</span>
						<button class="panel-button format-button" data-format="js" title="JS-Code aufräumen" aria-label="JavaScript-Code aufräumen" aria-controls="jsEditor"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span class="button-text">Aufräumen</span></button>
						<button class="panel-button download-button" id="downloadJs" title="JavaScript-Datei herunterladen" aria-label="JavaScript-Datei herunterladen" aria-controls="jsEditor"><i class="fa-solid fa-download" aria-hidden="true"></i><span class="button-text">Download</span></button>
						<button class="panel-button collapse-button" data-collapse="js" aria-expanded="false" aria-controls="jsEditor" title="JavaScript-Editor ausklappen" aria-label="JavaScript-Editor ausklappen"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
					</div>
					<div id="jsEditor" class="ace-editor" aria-labelledby="jsPanelTitle jsPanelFile"></div>
				</section>
			</section>
			<section class="preview-panel" id="previewPanel" aria-labelledby="previewPanelTitle">
				<div class="panel-header"><span class="panel-title" id="previewPanelTitle">Vorschau</span><span id="previewStatus" class="status" role="status" aria-live="polite">Aktuell</span><button id="refreshPreview" class="panel-button" title="Vorschau aktualisieren" aria-label="Vorschau aktualisieren" aria-controls="previewFrame"><i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i></button></div>
				<iframe id="previewFrame" title="Live-Vorschau" aria-describedby="previewStatus" sandbox="allow-scripts allow-modals"></iframe>
			</section>
		</main>
	</div>

	<footer class="statusbar"><span id="saveStatus" role="status"></span><span id="versionInfo"></span></footer>

	<script src="editor.js"></script>
</body>
</html>
